name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day, so meetups that have happened move from next to past
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: deps.edn

      - name: Install the Clojure CLI
        run: |
          curl -fsSL -o linux-install.sh https://github.com/clojure/brew-install/releases/download/1.12.5.1664/linux-install.sh
          echo "fb2f0ce23373d64bb4f13fce2ce2924c54ee0c033755357900808a1250621d82  linux-install.sh" | sha256sum -c -
          sudo bash linux-install.sh

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: clojure -X:build
        env:
          # "/<repo>", or "" with a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
